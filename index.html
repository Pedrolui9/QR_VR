<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Modelo 3D AR</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>
</head>

<body>

<model-viewer
    src="Robot.glb"

    alt="Modelo 3D del edificio"

    ar

    ar-modes="webxr scene-viewer quick-look"

    ar-scale="auto"

    ar-placement="floor"

    camera-controls

    auto-rotate

    shadow-intensity="1"

    style="
        width:100%;
        height:90vh;
        background:#eeeeee;
    ">

    <button
        slot="ar-button"
        style="
        position:absolute;
        bottom:30px;
        left:50%;
        transform:translateX(-50%);
        padding:15px 25px;
        font-size:18px;
        border:none;
        border-radius:10px;
        background:black;
        color:white;
        ">

        📱 Ver en realidad aumentada

    </button>

</model-viewer>

</body>

</html>
